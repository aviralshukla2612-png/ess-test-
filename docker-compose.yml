services:
  postgres:
    image: postgres:15-alpine
    container_name: emperor_assessment_db
    restart: always
    environment:
      POSTGRES_USER: emperor_admin
      POSTGRES_PASSWORD: emperor_secret_password_2026
      POSTGRES_DB: emperor_assessment
    ports:
      - '5439:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emperor_assessment_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://emperor_admin:emperor_secret_password_2026@postgres:5432/emperor_assessment?schema=public
      JWT_SECRET: emperor_smart_solutions_secret_jwt_key_2026_enterprise
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      CORS_ORIGIN: '*'
    ports:
      - '5090:5000'
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://187.127.158.24:5090/api
    container_name: emperor_assessment_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://187.127.158.24:5090/api
    ports:
      - '3090:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
